[package]
name = "shellumi-app"
version = "0.0.8-alpha"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gpui = "=0.2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellumi-storage = { path = "../shellumi-storage" }
shellumi-core = { path = "../shellumi-core" }
shellumi-terminal = { path = "../shellumi-terminal" }
shellumi-remote-desktop = { path = "../shellumi-remote-desktop" }
shellumi-vnc = { path = "../shellumi-vnc" }
shellumi-rdp = { path = "../shellumi-rdp" }
image = { version = "0.25", default-features = false, features = ["png"] }
smallvec = "1"
async-channel = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
tempfile = "3"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
hex = "0.4"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
tracing = "0.1"
cpal = "0.17"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_Shell"] }

[[test]]
name = "gpui_terminal_harness"
harness = false

[[test]]
name = "gpui_sftp_harness"
harness = false
