[package]
name = "shellumi-app"
version = "0.0.7-alpha"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
gpui = "=0.2.2"
serde_json = "1.0"
shellumi-storage = { path = "../shellumi-storage" }
shellumi-core = { path = "../shellumi-core" }
shellumi-terminal = { path = "../shellumi-terminal" }
async-channel = "2"
tokio = { version = "1", features = ["rt"] }
tempfile = "3"
base64 = "0.22"
uuid = { version = "1", features = ["serde", "v4"] }
