[package]
name = "shellumi-storage"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
turso = { version = "=0.9.0-pre.2", default-features = false }
shellumi-core = { path = "../shellumi-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tempfile = "3"
