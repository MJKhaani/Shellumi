[package]
name = "shellumi-core"
version = "0.0.1-alpha"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ring = "0.17"
base64 = "0.22"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3"

