[package]
name = "shellumi-core"
version = "0.0.8-alpha"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
ring = "0.17"
base64 = "0.22"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde", "v4"] }
sha2 = "0.10"
hex = "0.4"
x25519-dalek = { version = "3.0.0-rc.1", default-features = false, features = ["static_secrets"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["rustls-tls-native-roots", "connect"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-os-layer = "0.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3"

