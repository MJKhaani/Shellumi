[package]
name = "shellumi-vnc"
version = "0.0.8-alpha"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
shellumi-remote-desktop = { path = "../shellumi-remote-desktop" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
async-channel = "2"
thiserror = "2"
serde = { version = "1.0", features = ["derive"] }
byteorder = "1.5"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
zeroize = { version = "1.9", features = ["zeroize_derive"] }
tracing = "0.1"
aes = "0.8"
md-5 = "0.10"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
