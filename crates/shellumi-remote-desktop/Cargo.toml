[package]
name = "shellumi-remote-desktop"
version = "0.0.8-alpha"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2"
thiserror = "2"
zeroize = { version = "1.9", features = ["zeroize_derive", "serde"] }

[dev-dependencies]
tempfile = "3"
