name: Verify Documentation

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'docs/**'
      - 'resources/**'
      - 'scripts/verify-docs.sh'
      - 'scripts/test-verify-docs.sh'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - 'resources/**'
      - 'scripts/verify-docs.sh'
      - 'scripts/test-verify-docs.sh'
      - '.github/workflows/docs.yml'

jobs:
  verify-docs:
    name: Verify Documentation Links, Assets & Validator Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run documentation validator regression tests
        run: ./scripts/test-verify-docs.sh
      - name: Run documentation verification script
        run: ./scripts/verify-docs.sh
