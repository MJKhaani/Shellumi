name: Release binaries

on:
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: shellumi-app
            asset: shellumi-linux-x86_64
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            binary: shellumi-app.exe
            asset: shellumi-windows-x86_64.exe
          - runner: macos-15
            target: aarch64-apple-darwin
            binary: shellumi-app
            asset: shellumi-macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: shellumi-app
            asset: shellumi-macos-x86_64
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config clang cmake libfontconfig1-dev libfreetype6-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libssl-dev
      - name: Check Metal compiler
        if: runner.os == 'macOS'
        run: xcrun --find metal
      - name: Install Rust target
        run: rustup update stable && rustup default stable && rustup target add ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release -p shellumi-app --target ${{ matrix.target }}
      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum shellumi-* > SHA256SUMS.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes
          fi
          gh release upload "$TAG" shellumi-* SHA256SUMS.txt --clobber
