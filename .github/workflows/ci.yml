name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-macos:
    name: Verify (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Run SFTP unit, protocol, and GPUI harness tests
        run: |
          cargo test --locked -p shellumi-core sftp
          cargo test --locked -p shellumi-app sftp
          cargo test --locked -p shellumi-app --test gpui_sftp_harness
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo test --locked -p shellumi-app --test ssh_sftp_acceptance -- --ignored --nocapture
          fi

      - name: Build release binaries
        run: |
          cargo build --locked --release -p shellumi-app
          cargo build --locked --release -p shellumi-cli

  verify-linux:
    name: Verify (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI & audio system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libasound2-dev desktop-file-utils

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate desktop entry (Terminal=false)
        run: |
          desktop-file-validate packaging/linux/shellumi.desktop
          grep -q '^Terminal=false$' packaging/linux/shellumi.desktop

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Run SFTP unit, protocol, and GPUI harness tests
        run: |
          cargo test --locked -p shellumi-core sftp
          cargo test --locked -p shellumi-app sftp
          cargo test --locked -p shellumi-app --test gpui_sftp_harness
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo test --locked -p shellumi-app --test ssh_sftp_acceptance -- --ignored --nocapture
          fi

      - name: Build release binaries
        run: |
          cargo build --locked --release -p shellumi-app
          cargo build --locked --release -p shellumi-cli

  verify-windows:
    name: Verify (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace

      - name: Run SFTP unit, protocol, and GPUI harness tests
        run: |
          cargo test --locked -p shellumi-core sftp
          cargo test --locked -p shellumi-app sftp
          cargo test --locked -p shellumi-app --test gpui_sftp_harness
          if [ "${{ runner.os }}" = "macOS" ]; then
            cargo test --locked -p shellumi-app --test ssh_sftp_acceptance -- --ignored --nocapture
          fi

      - name: Build release binaries and verify PE subsystems
        shell: pwsh
        run: |
          cargo build --locked --release -p shellumi-app
          cargo build --locked --release -p shellumi-cli
          function Get-PeSubsystem([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 24 + 68)
          }
          $appSub = Get-PeSubsystem "target/release/shellumi-app.exe"
          $cliSub = Get-PeSubsystem "target/release/shellumi-cli.exe"
          Write-Host "shellumi-app.exe PE subsystem: $appSub (expected 2 = WINDOWS_GUI)"
          Write-Host "shellumi-cli.exe PE subsystem: $cliSub (expected 3 = WINDOWS_CUI)"
          if ($appSub -ne 2) { throw "shellumi-app.exe must use WINDOWS_GUI subsystem (2), got $appSub" }
          if ($cliSub -ne 3) { throw "shellumi-cli.exe must use WINDOWS_CUI subsystem (3), got $cliSub" }
