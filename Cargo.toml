[workspace]
members = [
    "crates/shellumi-app",
    "crates/shellumi-core",
    "crates/shellumi-storage",
    "crates/shellumi-cli",
    "crates/shellumi-terminal",
    "crates/shellumi-remote-desktop",
]
resolver = "2"
exclude = ["vendor/xattr"]

[patch.crates-io]
xattr = { path = "vendor/xattr" }
